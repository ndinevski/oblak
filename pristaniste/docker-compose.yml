# Pristaniste - container service for Oblak
#
# Two pieces, mirroring how Spomen pairs its API with a stock MinIO:
#   - registry: a stock Docker Distribution registry, the image store
#   - pristaniste-api:  the Oblak-facing REST API over that registry and the host's
#                container engine

services:
  # ---------------------------------------------------------------------------
  # Image registry (the ECR-shaped half)
  # ---------------------------------------------------------------------------
  registry:
    image: registry:2
    container_name: pristaniste-registry
    restart: unless-stopped
    environment:
      # Deletion is off by default in the registry image. Without it Pristaniste's
      # delete endpoints return 501, so it is enabled here deliberately.
      REGISTRY_STORAGE_DELETE_ENABLED: "true"
      REGISTRY_STORAGE_FILESYSTEM_ROOTDIRECTORY: /var/lib/registry
      # The dashboard calls the registry through Pristaniste, but a browser talking to
      # it directly still needs these.
      REGISTRY_HTTP_HEADERS_Access-Control-Allow-Origin: '["*"]'
      REGISTRY_HTTP_HEADERS_Access-Control-Allow-Methods: '["HEAD","GET","OPTIONS","DELETE"]'
      REGISTRY_HTTP_HEADERS_Access-Control-Allow-Headers: '["Authorization","Accept","Cache-Control"]'
    volumes:
      - registry-data:/var/lib/registry
    ports:
      # Published so `docker push` from a workstation can reach it.
      - "${PRISTANISTE_REGISTRY_PORT:-5000}:5000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:5000/v2/ >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - pristaniste-network

  # ---------------------------------------------------------------------------
  # Pristaniste API (the ECS-shaped half, plus registry management)
  # ---------------------------------------------------------------------------
  pristaniste-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pristaniste-api
    restart: unless-stopped
    environment:
      PRISTANISTE_PORT: "8083"
      # Pristaniste reaches the registry over the compose network...
      REGISTRY_URL: ${REGISTRY_URL:-http://pristaniste-registry:5000}
      # ...but users push to it from the host, so image references need the
      # published address instead.
      REGISTRY_PUBLIC_HOST: ${PRISTANISTE_REGISTRY_PUBLIC_HOST:-localhost:5000}
      REGISTRY_USERNAME: ${PRISTANISTE_REGISTRY_USERNAME:-}
      REGISTRY_PASSWORD: ${PRISTANISTE_REGISTRY_PASSWORD:-}
      DOCKER_HOST: unix:///var/run/docker.sock
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-oblak-otel-collector:4317}
      OBLAK_ENV: ${OBLAK_ENV:-development}
    volumes:
      # SECURITY: Pristaniste runs containers, so it needs the host's container
      # engine. Access to docker.sock is equivalent to root on the host. Pristaniste
      # limits the blast radius by labelling everything it creates and refusing
      # to touch containers without that label, but the socket itself is still
      # full control. Do not expose Pristaniste's API to untrusted callers.
      - /var/run/docker.sock:/var/run/docker.sock
    # The image runs as a non-root user, so it needs the host's docker group to
    # read the socket. Override if your host differs:
    #   getent group docker | cut -d: -f3
    group_add:
      - "${DOCKER_GID:-989}"
    security_opt:
      # SELinux blocks a confined container from writing to docker.sock and no
      # boolean covers it. Same trade the telemetry collector makes; see
      # observability/docker-compose.yml.
      - label:disable
    ports:
      - "${PRISTANISTE_API_PORT:-8083}:8083"
    depends_on:
      registry:
        condition: service_healthy
    networks:
      - pristaniste-network
      - oblak-telemetry

volumes:
  registry-data:

networks:
  pristaniste-network:
    driver: bridge
  # Shared with the observability stack so telemetry reaches the collector.
  oblak-telemetry:
    name: oblak-telemetry
    external: true
