services:
  # Izvor API server
  izvor-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: izvor-api
    ports:
      - "${IZVOR_API_PORT:-8082}:8082"
    environment:
      IZVOR_PORT: "8082"
      PROXMOX_URL: ${PROXMOX_URL:-https://proxmox.local:8006}
      PROXMOX_USER: ${PROXMOX_USER:-root@pam}
      PROXMOX_PASSWORD: ${PROXMOX_PASSWORD:-}
      PROXMOX_TOKEN_ID: ${PROXMOX_TOKEN_ID:-}
      PROXMOX_TOKEN_SECRET: ${PROXMOX_TOKEN_SECRET:-}
      PROXMOX_NODE: ${PROXMOX_NODE:-}
      PROXMOX_INSECURE: ${PROXMOX_INSECURE:-true}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-oblak-otel-collector:4317}
      OBLAK_ENV: ${OBLAK_ENV:-development}
    restart: unless-stopped
    networks:
      - izvor-network
      - oblak-telemetry
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8082/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s

networks:
  izvor-network:
    driver: bridge
  # Shared with the observability stack so telemetry can reach the collector.
  oblak-telemetry:
    name: oblak-telemetry
    external: true
