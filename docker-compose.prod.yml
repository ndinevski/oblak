# Oblak Cloud Dashboard - Production Docker Compose
# Enhanced with security, resource limits, and monitoring
# Usage: docker compose -f docker-compose.prod.yml up -d

services:
  # PostgreSQL Database for Strapi
  postgres:
    image: postgres:16-alpine
    container_name: oblak-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-oblak_dashboard}
      # Security: disable statistics collection
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB:-oblak_dashboard}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - oblak-internal
    # Resource limits
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M
    # Security options
    security_opt:
      - no-new-privileges:true

  # Strapi Backend
  backend:
    build:
      context: ./backend-dashboard
      dockerfile: Dockerfile
    container_name: oblak-backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 1337
      # Database
      DATABASE_CLIENT: postgres
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_NAME: ${POSTGRES_DB:-oblak_dashboard}
      DATABASE_USERNAME: ${POSTGRES_USER:?POSTGRES_USER is required}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      DATABASE_SSL: "false"
      # Security keys
      APP_KEYS: ${APP_KEYS:?APP_KEYS is required}
      API_TOKEN_SALT: ${API_TOKEN_SALT:?API_TOKEN_SALT is required}
      ADMIN_JWT_SECRET: ${ADMIN_JWT_SECRET:?ADMIN_JWT_SECRET is required}
      TRANSFER_TOKEN_SALT: ${TRANSFER_TOKEN_SALT:?TRANSFER_TOKEN_SALT is required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      # Service URLs
      IMPULS_URL: ${IMPULS_URL:-http://impuls:8080}
      IMPULS_API_KEY: ${IMPULS_API_KEY:-}
      IZVOR_URL: ${IZVOR_URL:-http://izvor:8082}
      IZVOR_API_KEY: ${IZVOR_API_KEY:-}
      SPOMEN_URL: ${SPOMEN_URL:-http://spomen:8081}
      SPOMEN_ACCESS_KEY: ${SPOMEN_ACCESS_KEY:-}
      SPOMEN_SECRET_KEY: ${SPOMEN_SECRET_KEY:-}
      PRISTANISTE_URL: ${PRISTANISTE_URL:-http://pristaniste-api:8083}
      PRISTANISTE_API_KEY: ${PRISTANISTE_API_KEY:-}
      TEFTER_URL: ${TEFTER_URL:-http://tefter-api:8084}
      TEFTER_API_KEY: ${TEFTER_API_KEY:-}
      VRATA_URL: ${VRATA_URL:-http://vrata:8085}
      VRATA_API_KEY: ${VRATA_API_KEY:-}
      INDEKS_URL: ${INDEKS_URL:-http://indeks:8086}
      INDEKS_API_KEY: ${INDEKS_API_KEY:-}
      RED_URL: ${RED_URL:-http://red:8087}
      RED_API_KEY: ${RED_API_KEY:-}
      POLAROID_URL: ${POLAROID_URL:-http://polaroid:2283}
      POLAROID_API_KEY: ${POLAROID_API_KEY:-}
      # Identitet root account (full access, manages users)
      OBLAK_ROOT_EMAIL: ${OBLAK_ROOT_EMAIL:?OBLAK_ROOT_EMAIL is required}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:1337/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - oblak-internal
    # Resource limits
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 256M
    # Security options
    security_opt:
      - no-new-privileges:true
    # Read-only filesystem where possible
    read_only: false
    tmpfs:
      - /tmp
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # React Frontend (served via Nginx)
  frontend:
    build:
      context: ./frontend-dashboard
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:1337}
    container_name: oblak-frontend
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    networks:
      - oblak-internal
    # Resource limits
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 128M
        reservations:
          cpus: '0.1'
          memory: 32M
    # Security options
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: oblak-proxy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ./nginx/cache:/var/cache/nginx
    depends_on:
      - backend
      - frontend
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 3s
      retries: 3
    networks:
      - oblak-internal
      - oblak-external
    # Resource limits
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 64M
    # Security options
    security_opt:
      - no-new-privileges:true
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

  # Redis for caching (optional)
  redis:
    image: redis:7-alpine
    container_name: oblak-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 128mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - oblak-internal
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 64M
    security_opt:
      - no-new-privileges:true
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "3"

networks:
  oblak-internal:
    driver: bridge
    internal: true
  oblak-external:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
