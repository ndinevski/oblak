services:
  minio:
    image: minio/minio:latest
    container_name: spomen
    command: server /data --console-address ":9001"
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-spomen-admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-spomen-secret-key}
      MINIO_BROWSER_REDIRECT_URL: ${MINIO_BROWSER_REDIRECT_URL:-}
      # Let the collector scrape MinIO metrics without a bearer token.
      MINIO_PROMETHEUS_AUTH_TYPE: public
    volumes:
      - ${MINIO_DATA_DIR:-./data}:/data:z
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 30s
      timeout: 20s
      retries: 3
    restart: unless-stopped
    networks:
      - spomen-network
      - oblak-telemetry

  # Spomen API server
  spomen-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: spomen-api
    ports:
      - "${SPOMEN_API_PORT:-8081}:8081"
    environment:
      SPOMEN_PORT: "8081"
      MINIO_ENDPOINT: minio:9000
      MINIO_PUBLIC_ENDPOINT: ${MINIO_PUBLIC_ENDPOINT:-localhost:9000}
      MINIO_REGION: ${MINIO_REGION:-us-east-1}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-spomen-admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-spomen-secret-key}
      MINIO_USE_SSL: "false"
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-oblak-otel-collector:4317}
      OBLAK_ENV: ${OBLAK_ENV:-development}
    depends_on:
      minio:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - spomen-network
      - oblak-telemetry

  # Initialization container - creates default buckets
  minio-init:
    image: minio/mc:latest
    container_name: spomen-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: /bin/sh
    command: /init/init-buckets.sh
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-spomen-admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-spomen-secret-key}
    volumes:
      - ./scripts/init-buckets.sh:/init/init-buckets.sh:ro,z
    networks:
      - spomen-network

networks:
  spomen-network:
    driver: bridge
  # Shared with the observability stack so telemetry can reach the collector.
  oblak-telemetry:
    name: oblak-telemetry
    external: true
