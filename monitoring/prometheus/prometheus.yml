# Oblak Cloud Dashboard - Prometheus Configuration

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'oblak-production'
    env: 'production'

# Alertmanager configuration
alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

# Load rules
rule_files:
  - /etc/prometheus/alerts/*.yml

# Scrape configurations
scrape_configs:
  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Node Exporter - Host metrics
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']

  # cAdvisor - Container metrics
  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']

  # PostgreSQL Exporter
  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres-exporter:9187']

  # Backend Dashboard (Strapi)
  - job_name: 'backend'
    metrics_path: '/api/metrics'
    static_configs:
      - targets: ['backend:1337']
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: 'backend'

  # Impuls - Serverless Functions
  - job_name: 'impuls'
    static_configs:
      - targets: ['impuls:8080']
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: 'impuls'

  # Izvor - VM Management
  - job_name: 'izvor'
    static_configs:
      - targets: ['izvor:8080']
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: 'izvor'

  # Spomen - Object Storage
  - job_name: 'spomen'
    static_configs:
      - targets: ['spomen:8080']
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: 'spomen'

  # Redis
  - job_name: 'redis'
    static_configs:
      - targets: ['redis:6379']
