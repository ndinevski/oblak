# Oblak Cloud Dashboard - Grafana Dashboard Provisioning

apiVersion: 1

providers:
  - name: 'Oblak Dashboards'
    orgId: 1
    folder: 'Oblak'
    folderUid: 'oblak'
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
